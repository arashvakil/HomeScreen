# Optional self-hosted update server. Terminate HTTPS at your reverse proxy.
# Replace updates.example.com and serve the release APK + update.json here.
server {
    listen 80;
    server_name updates.example.com;
    root /var/www/homescreen;
    autoindex off;
    location = /update.json {
        add_header Cache-Control "no-cache, max-age=0";
        types { } default_type application/json;
        try_files $uri =404;
    }
    location ~* \.apk$ {
        types { } default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=86400, immutable";
        try_files $uri =404;
    }
    location / { return 404; }
}
